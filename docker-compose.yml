version: "3.9"
services:
  webcli:
    container_name: webcli
    user: "0:0"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - ./pcaps:/app/pcaps:rw
      - /root/.ssh/id_rsa:/root/.ssh/id_rsa:ro
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    container_name: caddy
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - ./certs:/certs:ro  
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webcli

volumes:
  caddy_data:
  caddy_config:
